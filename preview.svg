<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="poster" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="0" y="0" width="960" height="46" rx="14" fill="#f1f5f9"/>
  <rect x="0" y="32" width="960" height="14" fill="#f1f5f9"/>
  <circle cx="28" cy="23" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="23" r="6" fill="#febc2e"/>
  <circle cx="68" cy="23" r="6" fill="#28c840"/>
  <text x="480" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">图片二维码合成工具 · Image QR Code Composer</text>

  <!-- left canvas -->
  <rect x="24" y="66" width="600" height="470" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="92" font-size="12" fill="#94a3b8">画布 / Canvas</text>

  <!-- poster base -->
  <rect x="150" y="118" width="360" height="360" rx="8" fill="url(#poster)"/>
  <text x="330" y="158" text-anchor="middle" font-size="22" font-weight="800" fill="#7c2d12">洛漫西餐厅</text>
  <text x="330" y="186" text-anchor="middle" font-size="12" fill="#9a3412">LUOMAN Western Restaurant</text>
  <line x1="200" y1="204" x2="460" y2="204" stroke="#9a3412" stroke-opacity="0.4"/>
  <text x="330" y="232" text-anchor="middle" font-size="13" fill="#7c2d12">扫码点餐 · 立享会员价</text>

  <!-- QR on poster -->
  <g transform="translate(290,300)">
    <rect width="84" height="84" rx="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="8" y="8" width="22" height="22" fill="#111827"/><rect x="12" y="12" width="14" height="14" fill="#fff"/><rect x="15" y="15" width="8" height="8" fill="#111827"/>
    <rect x="54" y="8" width="22" height="22" fill="#111827"/><rect x="58" y="12" width="14" height="14" fill="#fff"/><rect x="61" y="15" width="8" height="8" fill="#111827"/>
    <rect x="8" y="54" width="22" height="22" fill="#111827"/><rect x="12" y="58" width="14" height="14" fill="#fff"/><rect x="15" y="61" width="8" height="8" fill="#111827"/>
    <rect x="36" y="10" width="6" height="6" fill="#111827"/><rect x="44" y="10" width="6" height="6" fill="#111827"/>
    <rect x="10" y="36" width="6" height="6" fill="#111827"/><rect x="22" y="36" width="6" height="6" fill="#111827"/><rect x="36" y="36" width="6" height="6" fill="#111827"/><rect x="50" y="36" width="6" height="6" fill="#111827"/><rect x="62" y="36" width="6" height="6" fill="#111827"/>
    <rect x="36" y="50" width="6" height="6" fill="#111827"/><rect x="50" y="50" width="6" height="6" fill="#111827"/><rect x="62" y="50" width="6" height="6" fill="#111827"/><rect x="36" y="62" width="6" height="6" fill="#111827"/><rect x="50" y="62" width="6" height="6" fill="#111827"/><rect x="62" y="62" width="6" height="6" fill="#111827"/>
  </g>
  <text x="332" y="410" text-anchor="middle" font-size="11" fill="#7c2d12">长按/扫码识别</text>

  <!-- drag handle hint -->
  <circle cx="332" cy="342" r="6" fill="#2563eb"/>
  <text x="346" y="346" font-size="11" fill="#2563eb">拖拽手柄</text>

  <!-- right panel -->
  <rect x="648" y="66" width="288" height="470" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="668" y="94" font-size="14" font-weight="700" fill="#0f172a">属性 / Properties</text>
  <line x1="668" y1="106" x2="916" y2="106" stroke="#e2e8f0"/>

  <!-- rows -->
  <text x="668" y="132" font-size="12" fill="#475569">位置 X / Y</text>
  <rect x="760" y="120" width="64" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="836" y="120" width="64" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>

  <text x="668" y="166" font-size="12" fill="#475569">缩放 Scale</text>
  <rect x="760" y="156" width="140" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="820" y="152" width="14" height="14" rx="7" fill="url(#accent)"/>

  <text x="668" y="198" font-size="12" fill="#475569">旋转 Rotate</text>
  <rect x="760" y="188" width="140" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="870" y="184" width="14" height="14" rx="7" fill="url(#accent)"/>

  <text x="668" y="230" font-size="12" fill="#475569">裁剪 Crop (L/T/R/B)</text>
  <rect x="760" y="218" width="30" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="796" y="218" width="30" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="832" y="218" width="30" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="868" y="218" width="30" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>

  <!-- buttons -->
  <rect x="668" y="470" width="232" height="40" rx="8" fill="#16a34a"/>
  <text x="784" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">批量导出 ZIP</text>
  <rect x="668" y="420" width="112" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="724" y="442" text-anchor="middle" font-size="13" fill="#475569">重置</text>
  <rect x="788" y="420" width="112" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="844" y="442" text-anchor="middle" font-size="13" fill="#475569">导入二维码</text>
</svg>
